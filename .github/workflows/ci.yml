name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run critical lint checks
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Report additional lint findings
        run: |
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        env:
          ENVIRONMENT: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_password
          SECRET_KEY: test-secret-key-for-ci-only
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Check for hardcoded secrets with Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          GITLEAKS_LEAK_EXIT: "7"
        run: |
          set -euo pipefail

          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"

          echo "Downloading ${url}"
          curl --fail --show-error --silent --location --retry 3 --retry-delay 2 \
            --output "${tarball}" "${url}"

          echo "${GITLEAKS_SHA256} ${tarball}" | sha256sum --check --strict -
          tar -xzf "${tarball}" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "${tarball}" gitleaks

          installed="$(gitleaks version)"
          echo "Installed gitleaks ${installed}"
          test "${installed}" = "${GITLEAKS_VERSION}"

          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --verbose \
            --exit-code "${GITLEAKS_LEAK_EXIT}"
